# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    permissions:
      id-token: write
      contents: read
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Build and test
        run: nix develop --command bb ci
      - uses: actions/upload-artifact@2848b2cda0e5190984587ec6bb1f36730ca78d50 # tag: v4.6.2
        with:
          name: platform-shim-jars
          path: |
            shim/linux-*/target/*.jar
            shim/macos-*/target/*.jar
          if-no-files-found: error
          compression-level: 6
